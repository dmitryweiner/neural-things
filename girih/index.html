<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Girih — N-fold symmetry pattern generator</title>
  <link rel="stylesheet" href="../lib/nt-ui.css">
  <style>
    :root {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color-scheme: dark;
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0b0f14;
      color: #e8eef6;
    }

    .topbar {
      flex-shrink: 0;
      z-index: 30;
      background: #0d131b;
      border-bottom: 1px solid #1d2a3a;
      padding: 12px 14px;
    }
    .topbar h1 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 750;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status-text {
      font-size: 12px;
      font-weight: 400;
      color: #7a8fa6;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      background: #1d3557;
      color: #fff;
      border: 0;
      padding: 9px 11px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 650;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.ghost {
      background: #14202e;
      border: 1px solid #1d2a3a;
    }
    button.ghost:hover { background: #1a2a3d; }
    button.seg {
      background: #14202e;
      border: 1px solid #1d2a3a;
      padding: 7px 11px;
      border-radius: 8px;
      font-weight: 650;
      min-width: 36px;
    }
    button.seg.active {
      background: #2b4a78;
      border-color: #3d6aa8;
      color: #fff;
    }

    #settingsBtn { background: #1d3557; }
    #settingsBtn:hover { background: #2a4a6f; }
    #settingsBtn.active { background: #3d5a80; }

    .canvasStage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #060a0f;
      touch-action: none;
    }
    #girihCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    #girihCanvas.panning { cursor: grabbing; }

    .hintOverlay {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 5;
      background: rgba(13, 19, 27, 0.82);
      border: 1px solid #1d2a3a;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      color: #a8b9cf;
      pointer-events: none;
      max-width: 320px;
      line-height: 1.45;
    }
    .hintOverlay b { color: #e8eef6; }

    .settingsBackdrop {
      position: absolute;
      inset: 0;
      z-index: 24;
      background: transparent;
      opacity: 0;
      pointer-events: none;
    }
    .settingsBackdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .settingsDrawer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(400px, 92vw);
      z-index: 25;
      background: #0b1119;
      border-left: 1px solid #1d2a3a;
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.48);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      visibility: hidden;
      transition: transform 0.22s ease, visibility 0.22s;
    }
    .settingsDrawer.is-open {
      transform: translateX(0);
      visibility: visible;
    }

    .settingsDrawerScroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
      -webkit-overflow-scrolling: touch;
    }

    .settingsDrawer h3 {
      margin: 0 0 10px;
      font-size: 13px;
      color: #d9e7ff;
    }
    .settingsDrawer h4 {
      margin: 14px 0 8px;
      font-size: 12px;
      color: #9fb6d3;
      font-weight: 650;
    }
    .settingsDrawer h4:first-of-type { margin-top: 0; }

    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .color-row label {
      font-size: 12px;
      color: var(--nt-text-ctrl, #cfe1ff);
      min-width: 110px;
    }
    .color-row input[type="color"] {
      width: 44px;
      height: 32px;
      padding: 2px;
      border: 1px solid #1d2a3a;
      border-radius: 8px;
      background: #0f1b29;
      cursor: pointer;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 12px;
      color: var(--nt-text-ctrl, #cfe1ff);
    }
    .toggle-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #3d6aa8;
    }

    .sep {
      height: 1px;
      background: #1d2a3a;
      margin: 12px 0;
    }

    @media (max-width: 640px) {
      .btn-group {
        gap: 6px;
        padding: 6px 0;
        width: 100%;
      }
      .ctrl.with-adj {
        grid-template-columns: 90px auto 1fr auto 54px;
      }
      .settingsDrawer {
        left: 0;
        right: 0;
        top: auto;
        bottom: 0;
        width: 100%;
        height: min(72vh, 620px);
        max-height: 82vh;
        border-left: none;
        border-top: 1px solid #1d2a3a;
        border-radius: 14px 14px 0 0;
        box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.55);
        transform: translateY(100%);
      }
      .settingsDrawer.is-open {
        transform: translateY(0);
      }
      .hintOverlay { display: none; }
    }
  </style>
</head>
<body>

<section class="topbar">
  <h1>Girih <span class="status-text" id="statusHint">Draw in one wedge — the rest is mirrored around the center</span></h1>

  <div class="row">
    <div class="btn-group">
      <button type="button" id="settingsBtn">⚙ Settings ▶</button>
      <button type="button" class="ghost" id="toolFreehandBtn" title="Freehand (F)">✎ Freehand</button>
      <button type="button" class="ghost" id="toolPolylineBtn" title="Polyline (P)">∠ Polyline</button>
      <button type="button" class="ghost" id="undoBtn" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
      <button type="button" class="ghost" id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)">↷ Redo</button>
      <button type="button" class="ghost" id="clearBtn" title="Clear all strokes">🗑 Clear</button>
      <button type="button" id="savePngBtn">Save PNG</button>
      <button type="button" class="ghost" id="saveSvgBtn">Save SVG</button>
    </div>
  </div>
</section>

<div id="canvasStage" class="canvasStage">
  <canvas id="girihCanvas"></canvas>
  <div class="hintOverlay" id="hintOverlay">
    <b>Polyline:</b> click to place vertices. <b>Enter</b> or double-click to finish, <b>Esc</b> to cancel.
    Hold <b>Shift</b> to disable snap.
  </div>
  <div id="settingsBackdrop" class="settingsBackdrop" aria-hidden="true"></div>
  <aside id="settingsPanel" class="settingsDrawer" aria-hidden="true">
    <div class="settingsDrawerScroll">
      <h3>Settings</h3>

      <h4>Symmetry</h4>
      <div class="row" id="symmetryRow" style="margin-bottom: 8px;">
        <div class="btn-group" id="symmetryBtns">
          <button type="button" class="seg" data-n="4">4</button>
          <button type="button" class="seg" data-n="6">6</button>
          <button type="button" class="seg" data-n="8">8</button>
          <button type="button" class="seg" data-n="10">10</button>
          <button type="button" class="seg" data-n="12">12</button>
        </div>
      </div>
      <div class="toggle-row">
        <label for="mirrorChk">Mirror (add reflection)</label>
        <input type="checkbox" id="mirrorChk" />
      </div>

      <div class="sep"></div>

      <h4>Drawing</h4>
      <div class="color-row">
        <label for="strokeColor">Line color</label>
        <input type="color" id="strokeColor" value="#e8c36a" />
      </div>
      <div class="color-row">
        <label for="bgColor">Background</label>
        <input type="color" id="bgColor" value="#0a0c10" />
      </div>
      <div class="ctrl with-adj">
        <label for="strokeWidth">Line width</label>
        <button type="button" class="adj-btn" data-slider="strokeWidth" data-dir="-1">−</button>
        <input type="range" id="strokeWidth" min="0.5" max="8" step="0.1" value="2" />
        <button type="button" class="adj-btn" data-slider="strokeWidth" data-dir="1">+</button>
        <div class="small" id="val_strokeWidth">2.0 px</div>
      </div>

      <div class="sep"></div>

      <h4>Snap (polyline)</h4>
      <div class="toggle-row">
        <label for="snapRadialChk">Snap to radial lines</label>
        <input type="checkbox" id="snapRadialChk" checked />
      </div>
      <div class="toggle-row">
        <label for="snapRingChk">Snap to concentric rings</label>
        <input type="checkbox" id="snapRingChk" checked />
      </div>
      <div class="ctrl with-adj">
        <label for="divisions">Radial subdivisions</label>
        <button type="button" class="adj-btn" data-slider="divisions" data-dir="-1">−</button>
        <input type="range" id="divisions" min="1" max="12" step="1" value="4" />
        <button type="button" class="adj-btn" data-slider="divisions" data-dir="1">+</button>
        <div class="small" id="val_divisions">4</div>
      </div>
      <div class="ctrl with-adj">
        <label for="rings">Concentric rings</label>
        <button type="button" class="adj-btn" data-slider="rings" data-dir="-1">−</button>
        <input type="range" id="rings" min="1" max="16" step="1" value="6" />
        <button type="button" class="adj-btn" data-slider="rings" data-dir="1">+</button>
        <div class="small" id="val_rings">6</div>
      </div>

      <div class="sep"></div>

      <h4>Guides</h4>
      <div class="toggle-row">
        <label for="showGuidesChk">Show guides</label>
        <input type="checkbox" id="showGuidesChk" checked />
      </div>
      <div class="toggle-row">
        <label for="highlightWedgeChk">Highlight active wedge</label>
        <input type="checkbox" id="highlightWedgeChk" checked />
      </div>

      <div class="sep"></div>

      <h4>Tile preview</h4>
      <div class="btn-group" id="tileBtns">
        <button type="button" class="seg active" data-tile="off">Off</button>
        <button type="button" class="seg" data-tile="square">Square grid</button>
        <button type="button" class="seg" data-tile="hex">Hex grid</button>
      </div>
      <div class="ctrl with-adj">
        <label for="tileScale">Tile scale</label>
        <button type="button" class="adj-btn" data-slider="tileScale" data-dir="-1">−</button>
        <input type="range" id="tileScale" min="0.15" max="1" step="0.01" value="0.5" />
        <button type="button" class="adj-btn" data-slider="tileScale" data-dir="1">+</button>
        <div class="small" id="val_tileScale">0.50</div>
      </div>
    </div>
  </aside>
</div>

<script src="../lib/nt-ui.js"></script>
<script src="../lib/nt-canvas.js"></script>
<script src="girih.js"></script>
</body>
</html>
