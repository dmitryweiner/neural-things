<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moiré pattern generator</title>
  <link rel="stylesheet" href="../lib/nt-ui.css">
  <style>
    :root {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color-scheme: dark;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0b0f14;
      color: #e8eef6;
    }

    .topbar {
      flex-shrink: 0;
      z-index: 30;
      background: #0d131b;
      border-bottom: 1px solid #1d2a3a;
      padding: 12px 14px;
    }
    .topbar h1 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 750;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status-text {
      font-size: 12px;
      font-weight: 400;
      color: #7a8fa6;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      background: #1d3557;
      color: #fff;
      border: 0;
      padding: 9px 11px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 650;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #settingsBtn {
      background: #1d3557;
    }
    #settingsBtn:hover {
      background: #2a4a6f;
    }
    #settingsBtn.active {
      background: #3d5a80;
    }

    /* Full-viewport canvas area below header */
    .canvasStage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #060a0f;
    }
    #moireCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Invisible overlay: closes panel on tap outside drawer without dimming the canvas */
    .settingsBackdrop {
      position: absolute;
      inset: 0;
      z-index: 24;
      background: transparent;
      opacity: 0;
      pointer-events: none;
    }
    .settingsBackdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Desktop / tablet: drawer from the right */
    .settingsDrawer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(400px, 92vw);
      z-index: 25;
      background: #0b1119;
      border-left: 1px solid #1d2a3a;
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.48);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      visibility: hidden;
      transition: transform 0.22s ease, visibility 0.22s;
    }
    .settingsDrawer.is-open {
      transform: translateX(0);
      visibility: visible;
    }

    .settingsDrawerScroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
      -webkit-overflow-scrolling: touch;
    }

    .settingsDrawer h3 {
      margin: 0 0 10px;
      font-size: 13px;
      color: #d9e7ff;
    }
    .settingsDrawer h4 {
      margin: 14px 0 8px;
      font-size: 12px;
      color: #9fb6d3;
      font-weight: 650;
    }
    .settingsDrawer h4:first-of-type {
      margin-top: 0;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .color-row label {
      font-size: 12px;
      color: var(--nt-text-ctrl, #cfe1ff);
      min-width: 110px;
    }
    .color-row input[type="color"] {
      width: 44px;
      height: 32px;
      padding: 2px;
      border: 1px solid #1d2a3a;
      border-radius: 8px;
      background: #0f1b29;
      cursor: pointer;
    }

    .layerCard {
      background: #0d131b;
      border: 1px solid #1d2a3a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .layerCard h4 {
      margin: 0 0 10px;
      font-size: 13px;
      color: #d9e7ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .layerCard .layer-remove {
      font-size: 11px;
      padding: 4px 10px;
    }

    .type-row {
      margin-bottom: 8px;
    }
    .type-row label {
      font-size: 12px;
      color: var(--nt-text-ctrl, #cfe1ff);
      display: block;
      margin-bottom: 4px;
    }
    .type-row select {
      width: 100%;
      max-width: 280px;
    }

    .sep {
      height: 1px;
      background: #1d2a3a;
      margin: 12px 0;
    }

    /* Narrow screens: bottom sheet — moiré stays visible above, controls scroll inside */
    @media (max-width: 640px) {
      .btn-group {
        gap: 6px;
        padding: 6px 0;
        border-bottom: 1px solid #1d2a3a;
        width: 100%;
      }
      .btn-group:last-of-type {
        border-bottom: none;
        padding-bottom: 0;
      }
      .ctrl.with-adj {
        grid-template-columns: 90px auto 1fr auto 54px;
      }

      .settingsDrawer {
        left: 0;
        right: 0;
        top: auto;
        bottom: 0;
        width: 100%;
        height: min(62vh, 520px);
        max-height: 78vh;
        border-left: none;
        border-top: 1px solid #1d2a3a;
        border-radius: 14px 14px 0 0;
        box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.55);
        transform: translateY(100%);
      }
      .settingsDrawer.is-open {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<section class="topbar">
  <h1>Moiré pattern generator <span class="status-text" id="statusHint">Overlay periodic grids on the canvas</span></h1>

  <div class="row">
    <div class="btn-group">
      <button type="button" id="settingsBtn">⚙ Settings ▶</button>
      <button type="button" id="saveBtn">Save</button>
    </div>
  </div>
</section>

<div id="canvasStage" class="canvasStage">
  <canvas id="moireCanvas" width="800" height="600"></canvas>
  <div id="settingsBackdrop" class="settingsBackdrop" aria-hidden="true"></div>
  <aside id="settingsPanel" class="settingsDrawer" aria-hidden="true">
    <div class="settingsDrawerScroll">
      <h3>Settings</h3>

      <div class="color-row">
        <label for="bgColor">Background color</label>
        <input type="color" id="bgColor" value="#0a0c10" />
      </div>

      <div class="sep"></div>

      <h4>Grids</h4>
      <div class="row" style="margin-bottom: 10px;">
        <button type="button" id="addLayerBtn">Add grid</button>
        <button type="button" id="removeLayerBtn">Remove last</button>
      </div>

      <div id="layersHost"></div>
    </div>
  </aside>
</div>

<script src="../lib/nt-ui.js"></script>
<script src="moire.js"></script>
</body>
</html>
